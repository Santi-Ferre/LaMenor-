<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adiviná la Canción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #15111a;
    --surface: #201a28;
    --surface-2: #2a2233;
    --gold: #f4c95d;
    --gold-dim: #8a7136;
    --green: #7fb77e;
    --red: #e36262;
    --cream: #f5f1e8;
    --muted: #a99fb0;
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: radial-gradient(1200px 800px at 50% -10%, #241c2d 0%, var(--bg) 55%);
    color: var(--cream);
    font-family: 'Space Grotesk', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 32px 16px;
  }
  .app{
    width:100%;
    max-width: 520px;
  }
  .eyebrow{
    font-size: 13px;
    color: var(--muted);
    text-align:center;
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }
  h1.brand{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    text-align:center;
    margin: 0 0 28px 0;
    color: var(--cream);
  }
  .card{
    background: var(--surface);
    border-radius: var(--radius);
    padding: 28px;
    border: 1px solid #33293e;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
  }

  /* ---------- Start screen ---------- */
  .field-label{
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 10px;
    display:block;
  }
  .search-row{
    display:flex;
    gap: 8px;
  }
  input[type=text]{
    flex:1;
    background: var(--surface-2);
    border: 1px solid #3a3045;
    color: var(--cream);
    padding: 13px 14px;
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
  }
  input[type=text]:focus{ border-color: var(--gold-dim); }
  button{
    font-family: inherit;
    cursor:pointer;
    border:none;
  }
  .btn-primary{
    background: var(--gold);
    color: #201a10;
    font-weight: 600;
    padding: 13px 20px;
    border-radius: 10px;
    font-size: 15px;
  }
  .btn-primary:disabled{ opacity: 0.5; cursor: default; }
  .chips{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }
  .chip{
    background: var(--surface-2);
    border: 1px solid #3a3045;
    color: var(--muted);
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 13px;
  }
  .chip:hover{ color: var(--cream); border-color: var(--gold-dim); }

  .mode-toggle{
    display:flex;
    gap: 8px;
    margin-bottom: 22px;
  }
  .mode-btn{
    flex:1;
    background: var(--surface-2);
    border: 1px solid #3a3045;
    color: var(--muted);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 2px;
  }
  .mode-btn .mode-sub{
    font-size: 11px;
    font-weight: 400;
    color: var(--muted);
  }
  .mode-btn.active{
    background: rgba(244,201,93,0.12);
    border-color: var(--gold-dim);
    color: var(--gold);
  }
  .mode-btn.active .mode-sub{ color: var(--gold); opacity: 0.75; }

  #rounds-picker{ margin-bottom: 22px; }
  .rounds-chips{ margin-top: 0; margin-bottom: 12px; }
  .chip.round-chip{ padding: 8px 14px; }
  .chip.round-chip.active{
    background: rgba(244,201,93,0.15);
    border-color: var(--gold-dim);
    color: var(--gold);
  }
  .custom-rounds-row{
    display:flex;
    align-items:center;
    gap: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .custom-rounds-row input{
    width: 80px;
    background: var(--surface-2);
    border: 1px solid #3a3045;
    color: var(--cream);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .custom-rounds-row input:focus{ border-color: var(--gold-dim); }

  .status{
    margin-top: 18px;
    font-size: 14px;
    color: var(--muted);
    text-align:center;
    min-height: 20px;
  }
  .status.err{ color: var(--red); }

  /* ---------- Game screen ---------- */
  .top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 22px;
    gap: 10px;
  }
  .artist-now-playing{
    font-size: 12px;
    color: var(--muted);
    text-align:center;
    margin-bottom: 10px;
  }
  .round-label{ font-size: 13px; color: var(--muted); }
  .score-label{ font-size: 13px; color: var(--gold); font-weight: 600; flex:1; text-align:right; }
  .btn-end{
    background: var(--surface-2);
    color: var(--muted);
    border: 1px solid #3a3045;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
  }
  .btn-end:hover{ color: var(--red); border-color: var(--red); }

  .disc-wrap{
    display:flex;
    justify-content:center;
    margin-bottom: 22px;
  }
  .disc{
    width: 120px; height: 120px;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at center, #0c0a10 0px, #0c0a10 2px, #1c1721 3px, #1c1721 5px);
    position: relative;
    box-shadow: 0 10px 30px -8px rgba(0,0,0,0.7);
    animation: spin 3.5s linear infinite;
    animation-play-state: paused;
  }
  .disc.playing{ animation-play-state: running; }
  .disc::after{
    content:"";
    position:absolute; top:50%; left:50%;
    width: 34px; height: 34px;
    background: var(--gold);
    border-radius: 50%;
    transform: translate(-50%,-50%);
  }
  .disc::before{
    content:"";
    position:absolute; top:50%; left:50%;
    width: 8px; height: 8px;
    background: var(--bg);
    border-radius: 50%;
    transform: translate(-50%,-50%);
    z-index:2;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .transport{
    display:flex;
    justify-content:center;
    gap: 12px;
    margin-bottom: 22px;
  }
  .btn-round{
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--gold);
    color: #201a10;
    font-size: 20px;
    display:flex; align-items:center; justify-content:center;
  }
  .btn-round:disabled{ opacity:0.35; }
  .btn-skip{
    background: var(--surface-2);
    color: var(--cream);
    border: 1px solid #3a3045;
    padding: 0 20px;
    border-radius: 999px;
    font-size: 14px;
    height: 52px;
  }
  .btn-skip:disabled{ opacity:0.35; }

  .timeline{
    display:flex;
    gap: 4px;
    margin-bottom: 6px;
  }
  .tick{
    flex:1;
    height: 6px;
    border-radius: 4px;
    background: var(--surface-2);
    overflow:hidden;
  }
  .tick .fill{
    height:100%;
    width:0%;
    background: var(--gold);
    transition: width 0.25s ease;
  }
  .tick.unlocked .fill{ width:100%; }
  .tick.active .fill{ background: var(--cream); }
  .stage-caption{
    text-align:center;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .guess-box{ position: relative; }
  .suggestions{
    position:absolute;
    top: calc(100% + 6px);
    left:0; right:0;
    background: var(--surface-2);
    border: 1px solid #3a3045;
    border-radius: 10px;
    overflow:hidden;
    z-index: 5;
    max-height: 220px;
    overflow-y:auto;
  }
  .suggestion{
    padding: 11px 14px;
    font-size: 14px;
    cursor:pointer;
    border-bottom: 1px solid #33293e;
  }
  .suggestion:last-child{ border-bottom:none; }
  .suggestion:hover{ background:#352b40; }
  .suggestion b{ color: var(--gold); }
  .suggestion .artist{ color: var(--muted); font-size: 12px; display:block; margin-top:2px; }

  /* ---------- Reveal ---------- */
  .reveal{
    display:flex;
    gap: 16px;
    align-items:center;
    margin-bottom: 20px;
  }
  .reveal img{
    width: 76px; height: 76px;
    border-radius: 10px;
    flex-shrink:0;
  }
  .reveal-text .title{
    font-family:'Fraunces', serif;
    font-size: 19px;
    font-weight:600;
    margin-bottom: 2px;
  }
  .reveal-text .artist{ color: var(--muted); font-size: 14px; }
  .result-banner{
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 14px;
    padding: 10px 14px;
    border-radius: 10px;
  }
  .result-banner.win{ background: rgba(127,183,126,0.15); color: var(--green); }
  .result-banner.lose{ background: rgba(227,98,98,0.15); color: var(--red); }

  .hidden{ display:none !important; }

  .final .score-big{
    font-family:'Fraunces', serif;
    font-size: 52px;
    font-weight: 700;
    text-align:center;
    color: var(--gold);
    margin: 4px 0 2px 0;
  }
  .final .score-sub{
    text-align:center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 22px;
  }
  .round-history{
    display:flex;
    flex-direction:column;
    gap: 8px;
    margin-bottom: 24px;
    max-height: 320px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .ranking-box{
    background: var(--surface-2);
    border: 1px solid #3a3045;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .ranking-box .search-row{ margin-top: 4px; }
  #player-name{ flex:1; }
  .ranking-list{
    margin-bottom: 20px;
  }
  .ranking-title{
    font-family:'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--cream);
  }
  .ranking-row{
    display:flex;
    align-items:center;
    gap: 10px;
    font-size: 13px;
    padding: 9px 12px;
    background: var(--surface-2);
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .ranking-row .pos{
    color: var(--gold);
    font-weight: 700;
    width: 20px;
  }
  .ranking-row .name{ flex:1; }
  .ranking-row .pts{ color: var(--gold); font-weight:600; }
  .ranking-row.me{ border: 1px solid var(--gold-dim); }
  .history-row{
    display:flex;
    justify-content:space-between;
    font-size: 13px;
    padding: 9px 12px;
    background: var(--surface-2);
    border-radius: 8px;
  }
  .history-row .pts{ color: var(--gold); font-weight:600; }

  footer.credit{
    text-align:center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 18px;
  }
</style>
</head>
<body>

<div class="app">
  <div class="eyebrow">Un juego para tu oído</div>
  <h1 class="brand">Adiviná la Canción</h1>

  <!-- START SCREEN -->
  <div class="card" id="screen-start">
    <label class="field-label">Modo de juego</label>
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="rounds">Por rondas<span class="mode-sub" id="rounds-mode-sub">5 canciones</span></button>
      <button class="mode-btn" data-mode="infinite">Infinito<span class="mode-sub">jugá hasta que quieras</span></button>
    </div>

    <div id="rounds-picker">
      <label class="field-label">Cantidad de rondas</label>
      <div class="chips rounds-chips">
        <button class="chip round-chip active" data-n="5">5</button>
        <button class="chip round-chip" data-n="10">10</button>
        <button class="chip round-chip" data-n="15">15</button>
        <button class="chip round-chip" data-n="20">20</button>
        <button class="chip round-chip" data-n="30">30</button>
        <button class="chip round-chip" data-n="50">50</button>
      </div>
      <div class="custom-rounds-row">
        <span>O elegí un número:</span>
        <input type="number" id="rounds-custom" min="1" max="50" placeholder="1-50" />
      </div>
    </div>

    <label class="field-label">Dificultad</label>
    <div class="mode-toggle diff-toggle">
      <button class="mode-btn diff-btn" data-diff="easy">Fácil<span class="mode-sub">Solo los hits más conocidos</span></button>
      <button class="mode-btn diff-btn active" data-diff="normal">Normal<span class="mode-sub">Hits + colaboraciones</span></button>
      <button class="mode-btn diff-btn" data-diff="hard">Difícil<span class="mode-sub">Todo: remixes, en vivo, rarezas</span></button>
    </div>

    <label class="field-label" for="query">Escribí el nombre de un artista</label>
    <div class="search-row">
      <input type="text" id="query" placeholder="Ej: Bizarrap, Tini, Soda Stereo, Bad Bunny..." />
      <button class="btn-primary" id="btn-start">Buscar</button>
    </div>
    <div class="chips">
      <button class="chip artist-chip" data-q="Duki">Duki</button>
      <button class="chip artist-chip" data-q="Tini">Tini</button>
      <button class="chip artist-chip" data-q="Bizarrap">Bizarrap</button>
      <button class="chip artist-chip" data-q="Soda Stereo">Soda Stereo</button>
      <button class="chip artist-chip" data-q="Bad Bunny">Bad Bunny</button>
      <button class="chip artist-chip" data-q="Shakira">Shakira</button>
    </div>
    <div class="status" id="start-status"></div>
  </div>

  <!-- GAME SCREEN -->
  <div class="card hidden" id="screen-game">
    <div class="artist-now-playing" id="artist-now-playing">Jugando con: —</div>
    <div class="top-row">
      <span class="round-label" id="round-label">Ronda 1 / 5</span>
      <span class="score-label" id="score-label">0 pts</span>
      <button class="btn-end" id="btn-end">Terminar</button>
    </div>

    <div class="disc-wrap"><div class="disc" id="disc"></div></div>

    <div class="timeline" id="timeline"></div>
    <div class="stage-caption" id="stage-caption">Escuchá 0.3 segundos y adiviná</div>

    <div class="transport">
      <button class="btn-round" id="btn-play" title="Reproducir">▶</button>
      <button class="btn-skip" id="btn-skip">Saltar →</button>
    </div>

    <div class="guess-box">
      <input type="text" id="guess-input" placeholder="Escribí el título de la canción..." autocomplete="off" />
      <div class="suggestions hidden" id="suggestions"></div>
    </div>

    <div id="result-area"></div>
  </div>

  <!-- FINAL SCREEN -->
  <div class="card hidden final" id="screen-final">
    <div class="score-big" id="final-score">0</div>
    <div class="score-sub">puntos en total</div>
    <div class="round-history" id="round-history"></div>

    <div class="ranking-box" id="ranking-submit-box">
      <label class="field-label" for="player-name">Guardá tu puntaje en el ranking de este artista</label>
      <div class="search-row">
        <input type="text" id="player-name" placeholder="Tu nombre" maxlength="20" />
        <button class="btn-primary" id="btn-submit-score">Guardar</button>
      </div>
      <div class="status" id="ranking-status"></div>
    </div>

    <div class="ranking-list" id="ranking-list"></div>

    <button class="btn-primary" id="btn-replay" style="width:100%;">Jugar de nuevo</button>
  </div>

  <footer class="credit">Canciones y previews de audio vía iTunes Search API</footer>
</div>

<script>
(function(){
  const STAGE_DURATIONS = [0.3, 1, 3, 7, 15]; // seconds unlocked, cumulative
  const STAGE_POINTS = [50, 40, 30, 20, 10];

  // ==== CONFIGURACIÓN DEL RANKING GLOBAL ====
  // Pegá acá la URL de tu Realtime Database de Firebase (instrucciones en el chat).
  // Ejemplo: "https://tu-proyecto-default-rtdb.firebaseio.com"
  const FIREBASE_DB_URL = "";

  const screenStart = document.getElementById('screen-start');
  const screenGame = document.getElementById('screen-game');
  const screenFinal = document.getElementById('screen-final');
  const startStatus = document.getElementById('start-status');
  const queryInput = document.getElementById('query');
  const btnStart = document.getElementById('btn-start');

  const roundLabel = document.getElementById('round-label');
  const scoreLabel = document.getElementById('score-label');
  const artistNowPlaying = document.getElementById('artist-now-playing');
  const playerNameInput = document.getElementById('player-name');
  const btnSubmitScore = document.getElementById('btn-submit-score');
  const rankingStatus = document.getElementById('ranking-status');
  const rankingList = document.getElementById('ranking-list');
  const rankingSubmitBox = document.getElementById('ranking-submit-box');
  const disc = document.getElementById('disc');
  const timeline = document.getElementById('timeline');
  const stageCaption = document.getElementById('stage-caption');
  const btnPlay = document.getElementById('btn-play');
  const btnSkip = document.getElementById('btn-skip');
  const guessInput = document.getElementById('guess-input');
  const suggestionsBox = document.getElementById('suggestions');
  const resultArea = document.getElementById('result-area');

  let pool = [];          // all tracks fetched {id,title,artist,artwork,preview}
  let roundOrder = [];    // tracks chosen for this game's rounds (mode: rounds)
  let infiniteQueue = []; // shuffled tracks queue, refilled as needed (mode: infinite)
  let mode = 'rounds';    // 'rounds' | 'infinite'
  let roundsWanted = 5;   // chosen round count when mode === 'rounds'
  let difficulty = 'normal'; // 'easy' | 'normal' | 'hard'
  let currentArtistKey = '';
  let currentArtistDisplayName = '';
  let scoreSavedThisGame = false;
  let currentRound = 0;
  let currentTrack = null;
  let stageIndex = 0;
  let score = 0;
  let history = [];
  let audio = null;
  let playTimeout = null;
  let activeStopHandler = null;
  let roundLocked = false;

  const roundsPicker = document.getElementById('rounds-picker');
  const roundsModeSub = document.getElementById('rounds-mode-sub');
  const roundsCustomInput = document.getElementById('rounds-custom');

  document.querySelectorAll('.mode-btn[data-mode]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.mode-btn[data-mode]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
      roundsPicker.classList.toggle('hidden', mode !== 'rounds');
    });
  });

  document.querySelectorAll('.diff-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      difficulty = btn.dataset.diff;
    });
  });

  document.querySelectorAll('.round-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('.round-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      roundsWanted = parseInt(chip.dataset.n, 10);
      roundsCustomInput.value = '';
      roundsModeSub.textContent = roundsWanted + ' canciones';
    });
  });

  roundsCustomInput.addEventListener('input', ()=>{
    let n = parseInt(roundsCustomInput.value, 10);
    if(!n || n < 1) return;
    if(n > 50){ n = 50; roundsCustomInput.value = 50; }
    roundsWanted = n;
    document.querySelectorAll('.round-chip').forEach(c=>c.classList.remove('active'));
    roundsModeSub.textContent = roundsWanted + ' canciones';
  });

  document.querySelectorAll('.artist-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      queryInput.value = chip.dataset.q;
      startGame();
    });
  });
  btnStart.addEventListener('click', startGame);
  queryInput.addEventListener('keydown', e=>{ if(e.key==='Enter') startGame(); });

  document.getElementById('btn-end').addEventListener('click', ()=>{
    if(history.length === 0 && roundLocked === false && currentRound <= 1){
      // nothing played yet, just bail back to start
      resetToStart();
      return;
    }
    showFinal();
  });

  function resetToStart(){
    clearTimeout(playTimeout);
    if(audio) audio.pause();
    screenGame.classList.add('hidden');
    screenFinal.classList.add('hidden');
    screenStart.classList.remove('hidden');
    btnStart.disabled = false;
  }

  async function startGame(){
    const q = queryInput.value.trim();
    if(!q){ setStatus('Escribí el nombre de un artista, o tocá uno de los ejemplos.', true); return; }
    setStatus('Buscando al artista "' + q + '"...', false);
    btnStart.disabled = true;
    try{
      const { tracks, matchedName } = await fetchArtistSongs(q);
      if(tracks.length < 4){
        setStatus('No encontré suficientes canciones con audio de "' + q + '". Probá escribiendo el nombre completo del artista.', true);
        btnStart.disabled = false;
        return;
      }
      pool = filterByDifficulty(tracks, difficulty);
      score = 0;
      history = [];
      currentRound = 0;
      infiniteQueue = [];
      roundOrder = buildRoundOrder(roundsWanted, pool);
      artistNowPlaying.textContent = 'Jugando con: ' + matchedName;
      currentArtistDisplayName = matchedName;
      currentArtistKey = normalize(matchedName).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'artista';
      scoreSavedThisGame = false;
      screenStart.classList.add('hidden');
      screenGame.classList.remove('hidden');
      screenFinal.classList.add('hidden');
      nextRound();
    }catch(err){
      setStatus('No se pudo cargar la lista de canciones (' + (err && err.message ? err.message : 'error de conexión') + '). Probá de nuevo.', true);
      btnStart.disabled = false;
    }
  }

  // Generic JSONP helper — avoids CORS/local-file issues when this file is opened directly in a browser.
  function jsonp(url){
    return new Promise((resolve, reject)=>{
      const cbName = '__itunesCb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
      const script = document.createElement('script');
      let settled = false;

      function cleanup(){
        delete window[cbName];
        if(script.parentNode) script.parentNode.removeChild(script);
        clearTimeout(timer);
      }

      window[cbName] = function(data){
        if(settled) return;
        settled = true;
        cleanup();
        resolve(data);
      };

      script.onerror = function(){
        if(settled) return;
        settled = true;
        cleanup();
        reject(new Error('no se pudo conectar con iTunes'));
      };

      const timer = setTimeout(()=>{
        if(settled) return;
        settled = true;
        cleanup();
        reject(new Error('tiempo de espera agotado'));
      }, 12000);

      script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
      document.body.appendChild(script);
    });
  }

  const COLLAB_RE = /\(feat\.|\bfeat\.|\bft\.|\bfeaturing\b|\bwith\b|\bcon\b\s/i;
  const ALT_VERSION_RE = /\bremix\b|\blive\b|\ben vivo\b|acoustic|acustic|\bversion\b|\bversión\b|\bedit\b|\bdemo\b|\bmix\)|\bkaraoke\b|\binstrumental\b/i;

  function tracksFromResults(results){
    const seen = new Set();
    const tracks = [];
    (results || []).forEach(item=>{
      if(item.wrapperType && item.wrapperType !== 'track') return; // skip the artist entry itself, etc.
      if(item.kind && item.kind !== 'song') return;
      if(!item.previewUrl || !item.trackName || !item.artistName) return;
      const key = item.trackName.toLowerCase().trim();
      if(seen.has(key)) return;
      seen.add(key);
      const title = item.trackName;
      tracks.push({
        id: item.trackId,
        title: title,
        artist: item.artistName,
        artwork: (item.artworkUrl100||'').replace('100x100','300x300'),
        preview: item.previewUrl,
        isCollab: COLLAB_RE.test(title),
        isAltVersion: ALT_VERSION_RE.test(title)
      });
    });
    return tracks.slice(0, 100);
  }

  function filterByDifficulty(tracks, level){
    let filtered;
    if(level === 'easy'){
      filtered = tracks.filter(t => !t.isCollab && !t.isAltVersion);
    }else if(level === 'hard'){
      filtered = tracks; // full catalog: deep cuts, remixes, live versions, collabs included
    }else{
      filtered = tracks.filter(t => !t.isAltVersion); // normal: hits + collabs, no alt versions
    }
    return filtered.length >= 4 ? filtered : tracks; // fall back to full pool if too restrictive
  }

  // Step 1: resolve the exact artist behind the typed name, so "Mora" doesn't
  // pull in unrelated matches like "LoMora" or a song literally titled "Mora".
  async function resolveArtist(name){
    const url = 'https://itunes.apple.com/search?term=' + encodeURIComponent(name) +
                '&entity=musicArtist&attribute=artistTerm&limit=10&country=AR';
    const data = await jsonp(url);
    const results = (data && data.results) || [];
    if(results.length === 0) return null;
    const exact = results.find(r => r.artistName && normalize(r.artistName) === normalize(name));
    const chosen = exact || results[0];
    return { id: chosen.artistId, name: chosen.artistName };
  }

  // Step 2: pull that exact artist's catalogue by their numeric id — precise, no fuzzy matching.
  async function songsForArtistId(artistId){
    const url = 'https://itunes.apple.com/lookup?id=' + artistId +
                '&entity=song&limit=200&country=AR';
    const data = await jsonp(url);
    return tracksFromResults(data && data.results);
  }

  // Fallback used only if the artist can't be resolved to an id: fuzzy song search by name.
  async function fuzzySongSearch(name){
    const url = 'https://itunes.apple.com/search?term=' + encodeURIComponent(name) +
                '&media=music&entity=song&attribute=artistTerm&limit=100&country=AR';
    const data = await jsonp(url);
    return tracksFromResults(data && data.results);
  }

  async function fetchArtistSongs(name){
    const artist = await resolveArtist(name);
    if(artist){
      const tracks = await songsForArtistId(artist.id);
      if(tracks.length >= 4){
        return { tracks, matchedName: artist.name };
      }
    }
    const fallbackTracks = await fuzzySongSearch(name);
    return { tracks: fallbackTracks, matchedName: name };
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  // Builds a list of n tracks for "rounds" mode. If n exceeds the pool size,
  // cycles through fresh shuffles so songs repeat rather than ending the game early.
  function buildRoundOrder(n, sourcePool){
    const result = [];
    while(result.length < n){
      const batch = shuffle(sourcePool);
      for(const t of batch){
        if(result.length >= n) break;
        result.push(t);
      }
    }
    return result;
  }

  function setStatus(msg, isErr){
    startStatus.textContent = msg;
    startStatus.classList.toggle('err', !!isErr);
  }

  function nextInfiniteTrack(){
    if(infiniteQueue.length === 0){
      infiniteQueue = shuffle(pool);
    }
    return infiniteQueue.pop();
  }

  function nextRound(){
    currentRound++;
    if(mode === 'rounds'){
      if(currentRound > roundOrder.length){
        showFinal();
        return;
      }
      currentTrack = roundOrder[currentRound-1];
    }else{
      currentTrack = nextInfiniteTrack();
    }
    stageIndex = 0;
    roundLocked = false;
    roundLabel.textContent = (mode === 'rounds')
      ? ('Ronda ' + currentRound + ' / ' + roundOrder.length)
      : ('Canción ' + currentRound);
    scoreLabel.textContent = score + ' pts';
    guessInput.value = '';
    guessInput.disabled = false;
    suggestionsBox.classList.add('hidden');
    resultArea.innerHTML = '';
    btnSkip.disabled = false;
    btnPlay.disabled = false;

    if(audio){
      if(activeStopHandler){ audio.removeEventListener('timeupdate', activeStopHandler); activeStopHandler = null; }
      clearTimeout(playTimeout);
      audio.pause();
    }
    audio = new Audio(currentTrack.preview);

    buildTimeline();
    updateStageCaption();
  }

  function buildTimeline(){
    timeline.innerHTML = '';
    STAGE_DURATIONS.forEach((d, i)=>{
      const tick = document.createElement('div');
      tick.className = 'tick';
      tick.innerHTML = '<div class="fill"></div>';
      timeline.appendChild(tick);
    });
    refreshTimeline();
  }

  function refreshTimeline(){
    const ticks = timeline.querySelectorAll('.tick');
    ticks.forEach((t,i)=>{
      t.classList.toggle('unlocked', i < stageIndex);
      t.classList.toggle('active', i === stageIndex);
    });
  }

  function updateStageCaption(){
    const d = STAGE_DURATIONS[stageIndex];
    stageCaption.textContent = 'Escuchá ' + d + ' segundo' + (d===1?'':'s') + ' y adiviná';
    refreshTimeline();
  }

  btnPlay.addEventListener('click', ()=>{
    if(!audio) return;
    stopPlayback(false);
    audio.currentTime = 0;
    const dur = STAGE_DURATIONS[stageIndex];

    // Primary cutoff: watch actual playback position, which stays accurate even
    // if headphones/bluetooth controls or a backgrounded tab mess with timers.
    activeStopHandler = function(){
      if(audio.currentTime >= dur){
        stopPlayback(true);
      }
    };
    audio.addEventListener('timeupdate', activeStopHandler);

    // Backup cutoff in case 'timeupdate' doesn't fire in time for some reason.
    playTimeout = setTimeout(()=>{ stopPlayback(true); }, dur * 1000 + 250);

    audio.play();
    disc.classList.add('playing');
  });

  function stopPlayback(pauseAudio){
    clearTimeout(playTimeout);
    if(activeStopHandler){
      audio.removeEventListener('timeupdate', activeStopHandler);
      activeStopHandler = null;
    }
    if(pauseAudio && audio){ audio.pause(); }
    disc.classList.remove('playing');
  }

  btnSkip.addEventListener('click', ()=>{
    if(roundLocked) return;
    advanceStage(false);
  });

  function advanceStage(wasWrong){
    if(stageIndex >= STAGE_DURATIONS.length - 1){
      endRound(false);
      return;
    }
    stageIndex++;
    updateStageCaption();
    if(wasWrong){
      flashResult('Esa no era. Se desbloqueó un fragmento más largo.', false, true);
    }
  }

  // Strips accents/diacritics so "cancion" matches "canción", "ano" matches "año", etc.
  function normalize(s){
    return s
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .trim();
  }

  guessInput.addEventListener('input', ()=>{
    const raw = guessInput.value.trim();
    if(!raw){ suggestionsBox.classList.add('hidden'); return; }
    const v = normalize(raw);
    const matches = pool.filter(t =>
      normalize(t.title).includes(v) || normalize(t.artist).includes(v)
    ).slice(0, 6);
    if(matches.length === 0){ suggestionsBox.classList.add('hidden'); return; }
    suggestionsBox.innerHTML = '';
    matches.forEach(m=>{
      const row = document.createElement('div');
      row.className = 'suggestion';
      row.innerHTML = '<b>'+escapeHtml(m.title)+'</b><span class="artist">'+escapeHtml(m.artist)+'</span>';
      row.addEventListener('click', ()=> submitGuess(m));
      suggestionsBox.appendChild(row);
    });
    suggestionsBox.classList.remove('hidden');
  });

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function submitGuess(chosenTrack){
    if(roundLocked) return;
    suggestionsBox.classList.add('hidden');
    guessInput.value = chosenTrack.title;
    if(chosenTrack.id === currentTrack.id){
      endRound(true);
    }else{
      advanceStage(true);
    }
  }

  function endRound(won){
    roundLocked = true;
    stopPlayback(true);
    guessInput.disabled = true;
    btnSkip.disabled = true;
    btnPlay.disabled = true;

    const pts = won ? STAGE_POINTS[stageIndex] : 0;
    score += pts;
    history.push({title: currentTrack.title, artist: currentTrack.artist, points: pts, won: won});

    const banner = document.createElement('div');
    banner.className = 'result-banner ' + (won ? 'win' : 'lose');
    banner.textContent = won ? ('¡Correcto! +' + pts + ' pts') : 'Se acabaron los intentos para esta.';

    const reveal = document.createElement('div');
    reveal.className = 'reveal';
    reveal.innerHTML =
      '<img src="'+escapeHtml(currentTrack.artwork)+'" alt="">' +
      '<div class="reveal-text">' +
        '<div class="title">'+escapeHtml(currentTrack.title)+'</div>' +
        '<div class="artist">'+escapeHtml(currentTrack.artist)+'</div>' +
      '</div>';

    const btnNext = document.createElement('button');
    btnNext.className = 'btn-primary';
    btnNext.style.width = '100%';
    const isLastFixedRound = (mode === 'rounds' && currentRound >= roundOrder.length);
    btnNext.textContent = isLastFixedRound ? 'Ver resultado final' : 'Siguiente canción';
    btnNext.addEventListener('click', nextRound);

    resultArea.innerHTML = '';
    resultArea.appendChild(banner);
    resultArea.appendChild(reveal);
    resultArea.appendChild(btnNext);

    scoreLabel.textContent = score + ' pts';
  }

  function flashResult(msg, won, transient){
    resultArea.innerHTML = '<div class="result-banner lose">'+escapeHtml(msg)+'</div>';
    if(transient){
      setTimeout(()=>{ if(!roundLocked) resultArea.innerHTML=''; }, 1800);
    }
  }

  function showFinal(){
    screenGame.classList.add('hidden');
    screenFinal.classList.remove('hidden');
    document.getElementById('final-score').textContent = score;
    const histBox = document.getElementById('round-history');
    histBox.innerHTML = '';
    history.forEach((h,i)=>{
      const row = document.createElement('div');
      row.className = 'history-row';
      row.innerHTML = '<span>'+(i+1)+'. '+escapeHtml(h.title)+' — '+escapeHtml(h.artist)+'</span><span class="pts">'+(h.won ? ('+'+h.points) : '0')+'</span>';
      histBox.appendChild(row);
    });
    refreshRankingUI();
  }

  // ==== RANKING GLOBAL (Firebase Realtime Database) ====

  function rankingUrl(path){
    return FIREBASE_DB_URL.replace(/\/$/, '') + path;
  }

  async function loadRanking(artistKey){
    const res = await fetch(rankingUrl('/rankings/' + artistKey + '.json?orderBy="score"&limitToLast=10'));
    if(!res.ok) throw new Error('no se pudo leer el ranking');
    const data = await res.json();
    if(!data) return [];
    return Object.values(data).sort((a,b)=> b.score - a.score);
  }

  async function submitScore(artistKey, entry){
    const res = await fetch(rankingUrl('/rankings/' + artistKey + '.json'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(entry)
    });
    if(!res.ok) throw new Error('no se pudo guardar el puntaje');
  }

  function renderRankingList(entries){
    rankingList.innerHTML = '';
    if(entries.length === 0){
      rankingList.innerHTML = '<div class="status">Todavía nadie jugó a ' + escapeHtml(currentArtistDisplayName) + '. ¡Sé el primero!</div>';
      return;
    }
    const title = document.createElement('div');
    title.className = 'ranking-title';
    title.textContent = 'Ranking de ' + currentArtistDisplayName;
    rankingList.appendChild(title);
    entries.forEach((e,i)=>{
      const row = document.createElement('div');
      row.className = 'ranking-row';
      row.innerHTML = '<span class="pos">'+(i+1)+'</span><span class="name">'+escapeHtml(e.name||'Anónimo')+'</span><span class="pts">'+e.score+' pts</span>';
      rankingList.appendChild(row);
    });
  }

  async function refreshRankingUI(){
    rankingStatus.textContent = '';
    if(!FIREBASE_DB_URL){
      rankingSubmitBox.classList.add('hidden');
      rankingList.innerHTML = '<div class="status">El ranking global todavía no está configurado para este sitio.</div>';
      return;
    }
    rankingSubmitBox.classList.remove('hidden');
    playerNameInput.value = '';
    btnSubmitScore.disabled = false;
    rankingList.innerHTML = '<div class="status">Cargando ranking...</div>';
    try{
      const entries = await loadRanking(currentArtistKey);
      renderRankingList(entries);
    }catch(err){
      rankingList.innerHTML = '<div class="status err">No se pudo cargar el ranking.</div>';
    }
  }

  btnSubmitScore.addEventListener('click', async ()=>{
    if(scoreSavedThisGame) return;
    const name = playerNameInput.value.trim();
    if(!name){ rankingStatus.textContent = 'Escribí tu nombre primero.'; rankingStatus.classList.add('err'); return; }
    btnSubmitScore.disabled = true;
    rankingStatus.classList.remove('err');
    rankingStatus.textContent = 'Guardando...';
    try{
      await submitScore(currentArtistKey, {
        name: name.slice(0, 20),
        score: score,
        mode: mode,
        rounds: mode === 'rounds' ? roundsWanted : history.length,
        date: Date.now()
      });
      scoreSavedThisGame = true;
      rankingStatus.textContent = '¡Puntaje guardado!';
      const entries = await loadRanking(currentArtistKey);
      renderRankingList(entries);
    }catch(err){
      rankingStatus.textContent = 'No se pudo guardar. Probá de nuevo.';
      rankingStatus.classList.add('err');
      btnSubmitScore.disabled = false;
    }
  });

  document.getElementById('btn-replay').addEventListener('click', ()=>{
    screenFinal.classList.add('hidden');
    screenStart.classList.remove('hidden');
    btnStart.disabled = false;
    setStatus('', false);
  });

  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.guess-box')){
      suggestionsBox.classList.add('hidden');
    }
  });
})();
</script>
